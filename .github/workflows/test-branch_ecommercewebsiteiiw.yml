name: Azure Web App CI/CD

on:
  push:
    branches:
      - test-branch  # Trigger on push to the test-branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v3

      # Set up Python environment
      - name: 'Set up Python'
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'  # Update Python version to 3.10

      # Install Python dependencies
      - name: 'Install Dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -r Shivi_DjangoShop_22062024/req.txt

      # Run Django migrations
      - name: 'Run Django Migrations'
        working-directory: Shivi_DjangoShop_22062024  # Set working directory to Django app path
        env:
          DJANGO_SETTINGS_MODULE: 'Shivi_DjangoShop_22062024.settings'
        run: python manage.py migrate

      # Collect static files
      - name: 'Collect Static Files'
        working-directory: Shivi_DjangoShop_22062024  # Set working directory to Django app path
        env:
          DJANGO_SETTINGS_MODULE: 'Shivi_DjangoShop_22062024.settings'
        run: python manage.py collectstatic --noinput

      # Deploy to Azure Web App
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}  # The name of your Azure App Service
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}  # The publish profile stored in GitHub secrets
          package: ./Shivi_DjangoShop_22062024  # Path to your Django app directory
